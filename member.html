<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Member Dashboard</title>
  <link rel="stylesheet" href="css/member.css" />
</head>
<body>
  <div class="member-container">
    <button id="logoutBtn">Logout</button>
    <h2>Welcome, Member</h2>
    <div id="memberInfo">
      <h3>Your Profile</h3>
      <p>Loading your details...</p>
    </div>

    <div id="subscriptionStatus"></div>

    <div id="paymentOptions" style="display:none;">
      <button id="payUpi">Pay via UPI</button>
      <button id="payCod">Pay via COD</button>
    </div>

    <h3>Upgrade Package</h3>
    <select id="upgradePackage">
      <option value="">--Select Package--</option>
      <option value="starter">Starter (30 days)</option>
      <option value="basic">Basic (60 days)</option>
      <option value="silver">Silver (90 days)</option>
      <option value="gold">Gold (120 days)</option>
    </select>
    <button id="upgradeBtn">Upgrade</button>

    <h3>Billing History</h3>
    <table id="billingTable" border="1">
      <thead>
        <tr><th>Date</th><th>Package</th><th>Status</th><th>Amount</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script type="module" src="js/member.js"></script>
</body>
</html>
